# ClearSettle LOCAL DEVELOPMENT stack. Not a production deployment and not run in CI by default.
# Brings up PostgreSQL, Keycloak (dev realm requiring MFA), the backend, and the redacting reverse proxy
# on a single browser origin (https://localhost:8443). Copy deploy/.env.example to deploy/.env first.
#
# This stack is provided for local verification of the end-to-end flows (OIDC login, universal MFA,
# step-up, sessions, CSRF, F-1 logging). See deploy/README.md for validation steps.
name: clearsettle-dev

# Backend environment, shared by the optional second instance (profile "multi-instance").
x-backend-environment: &backend-environment
  DB_URL: jdbc:postgresql://db:5432/clearsettle
  DB_USER: app_rw
  DB_PASSWORD: ${APP_DB_PASSWORD}
  SPRING_SESSION_JDBC_INITIALIZE_SCHEMA: never
  CLEARSETTLE_OIDC_ENABLED: "true"
  CLEARSETTLE_OIDC_APPBASEURL: https://localhost:8443
  CLEARSETTLE_OIDC_LOGINSTATESECRET: ${LOGIN_STATE_SECRET}
  # issuer-uri must match the token 'iss'. host.docker.internal:8081 resolves to the same Keycloak
  # from both the host browser and this container, so the issuer is consistent (dev only).
  CLEARSETTLE_OIDC_KEYCLOAK_ISSUERURI: http://host.docker.internal:8081/realms/clearsettle
  CLEARSETTLE_OIDC_KEYCLOAK_CLIENTID: clearsettle-web
  CLEARSETTLE_OIDC_KEYCLOAK_CLIENTSECRET: ${KC_CLIENT_SECRET}
  # LOCAL DEVELOPMENT ONLY: registers a no-op sensitive operation so the step-up and single-use
  # confirmation can be exercised end to end (no real sensitive operation exists yet). Never set elsewhere.
  CLEARSETTLE_DEVFIXTURES_ENABLED: "true"

services:
  db:
    image: postgres:17.11-alpine
    container_name: clearsettle-db
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: clearsettle
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - ./db/init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - ../backend/src/main/resources/db/schema.sql:/schema/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clearsettle"]
      interval: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: clearsettle-keycloak
    command: ["start-dev", "--import-realm"]
    # Published on the host so the browser can reach it; KC_HOSTNAME uses host.docker.internal so the
    # token issuer is identical whether reached by the host browser or the backend container (dev only).
    ports:
      - "127.0.0.1:8081:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: http://host.docker.internal:8081
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
      CS_CLIENT_SECRET: ${KC_CLIENT_SECRET}
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 5s
      retries: 60

  backend:
    build: ../backend
    image: clearsettle-dev/backend:local
    container_name: clearsettle-backend
    depends_on:
      db: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment: *backend-environment

  # Optional second application instance on the same PostgreSQL session store, for the cross-instance
  # session tests (AC-163): `docker compose --profile multi-instance up -d backend-2`. The proxy keeps
  # routing to "backend"; this instance is reached directly on 127.0.0.1:8082 (plain HTTP, loopback only,
  # dev only). It runs the image built for "backend".
  backend-2:
    image: clearsettle-dev/backend:local
    pull_policy: never
    container_name: clearsettle-backend-2
    profiles: ["multi-instance"]
    depends_on:
      db: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8082:8080"
    environment: *backend-environment

  proxy:
    image: nginx:stable-alpine
    container_name: clearsettle-proxy
    depends_on: [backend]
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ../frontend/out:/srv/frontend:ro
