# ClearSettle reverse proxy — single origin (D-SEC-11): serves the client-rendered frontend and proxies
# the API/auth endpoints to the Spring Boot backend.
#
# F-1 mitigation (M1-E): the default access-log format logs "$request", which on the OIDC callback
# captures the authorization `code`, `state` and `session_state` in the query string. The callback route
# uses a redacted format that logs method + path (NO query) so no authorization code or other sensitive
# callback parameter is written to the access log, while method/path/status/timing are preserved.
# This is enforced at EVERY logging intermediary; see deploy/README.md. Validated by
# deploy/f1-logging-regression.sh with a synthetic marker.
worker_processes auto;
events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Full-request format for ordinary routes (no secrets expected in these query strings).
  log_format main '$remote_addr [$time_local] "$host" "$request" $status $body_bytes_sent rt=$request_time';
  # Redacted format for sensitive auth callbacks: method + normalized path + protocol, NO query string.
  log_format auth_redacted '$remote_addr [$time_local] "$host" "$request_method $uri $server_protocol" $status $body_bytes_sent rt=$request_time redacted_query';

  access_log /var/log/nginx/access.log main;
  error_log /var/log/nginx/error.log warn;

  sendfile on;
  server_tokens off;

  # Resolve the backend per request via Docker's DNS (not once at config load): nginx can then start and
  # reload while the backend is down, and follows the backend to a new IP after it is recreated.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 8443 ssl;
    server_name _;
    set $backend http://backend:8080;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # --- OIDC callback: query-redacted logging so the authorization code never reaches the log (F-1).
    #     Must precede the general /login/oauth2 proxy location.
    location ~ ^/login/oauth2/code/ {
      access_log /var/log/nginx/access.log auth_redacted;
      # nginx's error log always records the full request line ("request: GET ...?code=...&state=...")
      # on upstream errors and its format cannot be changed, so it would leak the code when the backend
      # is unavailable (verified in M1 integration testing). Discard error-log output for this route
      # only; the redacted access-log line above still records path, status (e.g. 502) and timing.
      error_log /dev/null;
      proxy_pass $backend;
    }

    # --- Backend auth + API endpoints (single origin).
    location ~ ^/(api|oauth2|login/oauth2|logout)(/|$) {
      proxy_pass $backend;
    }

    # --- Client-rendered frontend (static export). Unknown client routes fall back to the SPA shell.
    location / {
      root /srv/frontend;
      try_files $uri $uri/ $uri.html /index.html;
    }
  }
}
